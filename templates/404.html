{% extends 'base.html' %}
{% block title %}Page introuvable - {{ site.name }}{% endblock %}
{% block content %}
<section class="relative min-h-screen flex items-center justify-center overflow-hidden px-4">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-to-tr from-cyan-600/20 to-green-500/20 rounded-full blur-[120px] -z-10 animate-drift"></div>
    <div class="glass-card rounded-2xl p-10 text-center max-w-md animate-float">
        <p class="text-7xl font-extrabold text-gradient-cyan text-shimmer mb-2">404</p>
        <h1 class="text-xl font-bold text-white mb-2">Page introuvable</h1>
        <p class="text-sm text-egc-muted mb-6">La page demandée n'existe pas ou a été déplacée.</p>
        <a href="{{ url_for('index') }}" class="inline-block px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-green-500 font-bold text-white hover:brightness-110 transition-all">
            <i class="fa-solid fa-house mr-2"></i> Retour à l'accueil
        </a>
    </div>
</section>
{% endblock %}
