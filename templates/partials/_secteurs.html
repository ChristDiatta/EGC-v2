{% from '_macros.html' import section_head %}
<!-- Secteurs d'intervention & Clients -->
<section id="secteurs" class="py-20 relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        {{ section_head("Secteurs & Clients", "Qui accompagnons-nous ?") }}

        <!-- Sectors Cards Grid -->
        <div class="grid md:grid-cols-3 gap-8 mb-16">
            {% for s in sectors %}
            <div class="glass-card glass-card-hover p-8 rounded-2xl text-center" data-reveal data-delay="{{ loop.index0 * 140 }}">
                <div class="icon-tile w-16 h-16 rounded-2xl {{ s.box }} border flex items-center justify-center text-3xl mx-auto mb-6">
                    <i class="fa-solid {{ s.icon }} {{ s.grad }}"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">{{ s.title }}</h3>
                <p class="text-xs text-egc-muted leading-relaxed">{{ s.text }}</p>
            </div>
            {% endfor %}
        </div>

        <!-- Client Profiles Badges Grid -->
        <div class="glass-card p-8 rounded-2xl border border-white/10" data-reveal>
            <h3 class="text-center text-lg font-bold text-white mb-6">Nos Clients &amp; Interlocuteurs Privilégiés</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                {% for c in clients %}
                <div class="client-card p-4 rounded-xl bg-white/5 border border-white/5 text-center hover:border-cyan-500/30 transition-all" data-reveal="zoom" data-delay="{{ 100 + loop.index0 * 100 }}">
                    <i class="fa-solid {{ c.icon }} {{ c.c }} text-2xl mb-2"></i>
                    <p class="text-sm font-semibold text-white">{{ c.label }}</p>
                </div>
                {% endfor %}
            </div>
        </div>

    </div>
</section>
