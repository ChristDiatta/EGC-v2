<div class="glass-card p-8 rounded-2xl border border-white/10 shadow-2xl relative form-card">

                    <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-file-signature text-cyan-400"></i> Demande de Devis &amp; Étude Technique
                    </h3>

                    <!-- Success Alert Message (Hidden by default) -->
                    <div id="success-message" class="hidden mb-6 p-4 rounded-xl bg-green-500/20 border border-green-500/40 text-green-300 text-sm" role="status">
                        <i class="fa-solid fa-circle-check mr-2"></i>
                        <span id="success-text">Votre demande a bien été envoyée avec succès ! Notre bureau d'études vous recontactera sous 24h.</span>
                    </div>

                    <form id="contact-form" class="space-y-4" novalidate>

                        <!-- Honeypot anti-spam (invisible) -->
                        <div class="hp-field" aria-hidden="true">
                            <label for="website">Ne pas remplir</label>
                            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                        </div>

                        <div class="grid sm:grid-cols-2 gap-4">
                            <div class="field">
                                <label for="name" class="block text-xs font-semibold text-egc-muted mb-1">Nom complet *</label>
                                <input type="text" id="name" name="name" required placeholder="M. / Mme Ndiaye" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 text-sm">
                                <p class="field-error" data-error-for="name"></p>
                            </div>
                            <div class="field">
                                <label for="company" class="block text-xs font-semibold text-egc-muted mb-1">Entreprise / Organisme</label>
                                <input type="text" id="company" name="company" placeholder="Cabinet d'architecture, Promogroup..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 text-sm">
                                <p class="field-error" data-error-for="company"></p>
                            </div>
                        </div>

                        <div class="grid sm:grid-cols-2 gap-4">
                            <div class="field">
                                <label for="email" class="block text-xs font-semibold text-egc-muted mb-1">E-mail *</label>
                                <input type="email" id="email" name="email" required placeholder="adresse@domaine.com" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 text-sm">
                                <p class="field-error" data-error-for="email"></p>
                            </div>
                            <div class="field">
                                <label for="phone" class="block text-xs font-semibold text-egc-muted mb-1">Téléphone *</label>
                                <input type="tel" id="phone" name="phone" required placeholder="+221 77..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 text-sm">
                                <p class="field-error" data-error-for="phone"></p>
                            </div>
                        </div>

                        <!-- Lots selection checkboxes -->
                        <div class="field">
                            <label class="block text-xs font-semibold text-egc-muted mb-2">Lots techniques concernés *</label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="lots-group">
                                {% for value, label in lots %}
                                <label class="lot-chip flex items-center gap-2 p-2.5 rounded-lg bg-white/5 border border-white/5 text-xs text-white cursor-pointer hover:bg-white/10">
                                    <input type="checkbox" name="lots" value="{{ value }}" class="rounded text-cyan-500 focus:ring-0"> {{ label }}
                                </label>
                                {% endfor %}
                            </div>
                            <p class="field-error" data-error-for="lots"></p>
                        </div>

                        <div class="field">
                            <label for="message" class="block text-xs font-semibold text-egc-muted mb-1">Description du projet *</label>
                            <textarea id="message" name="message" rows="4" required placeholder="Précisez le type de bâtiment, la surface approximative, le lieu du projet..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 text-sm"></textarea>
                            <p class="field-error" data-error-for="message"></p>
                        </div>

                        <button type="submit" id="submit-btn" class="btn-fx w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-green-500 font-bold text-white shadow-lg hover:brightness-110 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane btn-icon"></i>
                            <span class="btn-label">Envoyer ma demande de devis</span>
                        </button>

                    </form>
                </div>
