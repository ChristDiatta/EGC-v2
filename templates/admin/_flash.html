{% with msgs = get_flashed_messages(with_categories=true) %}
{% for cat, msg in msgs %}
<div role="{{ 'alert' if cat == 'err' else 'status' }}" class="mb-4 px-4 py-3 rounded-xl text-sm font-semibold flex items-start gap-3 {{ 'bg-red-50 text-red-800 border border-red-200' if cat == 'err' else 'bg-green-50 text-green-800 border border-green-200' }}">
    <i class="fa-solid {{ 'fa-circle-exclamation' if cat == 'err' else 'fa-circle-check' }} mt-0.5"></i><span>{{ msg }}</span>
</div>
{% endfor %}
{% endwith %}
